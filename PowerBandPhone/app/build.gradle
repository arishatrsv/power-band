plugins {
    id 'com.android.application'
}

android {
    namespace 'cr.powerband.phone'
    compileSdk 34

    defaultConfig {
        applicationId "cr.powerband.phone"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
